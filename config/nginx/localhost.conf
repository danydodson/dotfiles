
server {
  listen 8080;
  server_name localhost;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name localhost;

  ssl_certificate /opt/homebrew/etc/nginx/ssl/localhost/localhost.crt;
  ssl_certificate_key /opt/homebrew/etc/nginx/ssl/localhost/localhost.key;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    root html;
    index index.html index.htm;
  }

  location = /irc {
    return 301 /irc/;
  }

  # Proxy The Lounge behind HTTPS at /irc/
  location ^~ /irc/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 1d;
    proxy_redirect off;
  }

  location = /transmission {
    return 301 /transmission/;
  }

  # Proxy Transmission behind HTTPS at /transmission/
  location ^~ /transmission/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:9091/transmission/;
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1d;
    proxy_redirect off;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root html;
  }
}
